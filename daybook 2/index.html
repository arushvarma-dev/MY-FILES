      a.href = URL.createObjectURL(blob);
      a.download = 'daybook-' + keyOf(new Date()) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Backup downloaded');
    } catch (err) { toast('Could not export'); }
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const comesFromDaybook = parsed && (parsed.entries || parsed.settings);
        if (!comesFromDaybook) throw new Error('bad file');
        if (!confirm('Replace your current timetable with this backup?')) return;
        state = normalize(parsed);
        save();
        ui.railNoteKey = null;
        ui.scrollKey = null;
        renderAll();
        toast('Backup restored');
      } catch (err) {
        toast('That file doesn’t look like a Daybook backup');
      }
    };
    reader.readAsText(file);
  }

  /* ── Clock ─────────────────────────────────────────────── */
  let lastDayKey = keyOf(new Date());
  function tick() {
    const k = keyOf(new Date());
    if (k !== lastDayKey) { lastDayKey = k; ui.railNoteKey = null; renderAll(); return; }
    const { s } = timeBounds();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    $$('.now-line').forEach(el => {
      if (el.dataset.date === k) el.style.top = ((nowMin - s * 60) / 60 * HOUR_H) + 'px';
    });
    updateNextUp();
    checkReminders();
  }

  /* ── Bind ──────────────────────────────────────────────── */
  function bind() {
    $('#prevBtn').addEventListener('click', () => { ui.cursor = addDays(ui.cursor, ui.view === 'week' ? -7 : -1); renderAll(); });
    $('#nextBtn').addEventListener('click', () => { ui.cursor = addDays(ui.cursor, ui.view === 'week' ? 7 : 1); renderAll(); });
    $('#todayBtn').addEventListener('click', () => { ui.cursor = startOfDay(new Date()); renderAll(); });
    $('#addBtn').addEventListener('click', () => openEditor({ day: defaultDay(), start: defaultStart() }));

    $$('[data-view]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.view;
      if (v === ui.view) return;
      if (v === 'day' && ui.view === 'week') {
        const ws = startOfWeek(ui.cursor), todayK = keyOf(new Date());
        let found = false;
        for (let i = 0; i < 7; i++) if (keyOf(addDays(ws, i)) === todayK) { ui.cursor = startOfDay(new Date()); found = true; break; }
        if (!found) ui.cursor = ws;
      }
      ui.view = v;
      renderAll();
    }));

    $('#themeBtn').addEventListener('click', () => {
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      save();
      applyTheme();
    });

    $('#exportBtn').addEventListener('click', exportData);
    $('#importBtn').addEventListener('click', () => $('#importFile').click());
    $('#clearBtn').addEventListener('click', () => {
      if (!state.entries.length) { toast('The timetable is already empty'); return; }
      if (!confirm('Clear every entry from the timetable? You can undo this right after.')) return;
      const backup = JSON.parse(JSON.stringify(state));
      state.entries = [];
      state.done = {};
      save();
      ui.railNoteKey = null;
      ui.scrollKey = null;
      renderAll();
      toast('Timetable cleared', {
        label: 'Undo',
        fn: () => { state = backup; save(); ui.railNoteKey = null; ui.scrollKey = null; renderAll(); }
      });
    });
    $('#importFile').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (f) importData(f);
      e.target.value = '';
    });

    $('#closeModal').addEventListener('click', closeModal);
    $('#cancelBtn').addEventListener('click', closeModal);
    $('#deleteBtn').addEventListener('click', deleteEditing);
    $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });

    $('#catPicker').addEventListener('click', e => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      ui.formCat = b.dataset.cat;
      renderCatPicker();
    });
    $('#fImportant').addEventListener('click', () => {
      ui.formImportant = !ui.formImportant;
      renderImportantToggle();
    });

    $('#installBtn').addEventListener('click', async () => {
      if (!installPrompt) {
        toast('Open your browser menu to install Daybook');
        return;
      }
      installPrompt.prompt();
      try {
        const choice = await installPrompt.userChoice;
        if (choice.outcome === 'accepted') toast('Installing Daybook…');
      } catch (e) {}
      installPrompt = null;
      $('#installBtn').hidden = true;
    });

    $('#remindBtn').addEventListener('click', async () => {
      state.settings.reminders = !state.settings.reminders;
      if (state.settings.reminders && reminderPermission() === 'default') {
        try { await Notification.requestPermission(); } catch (e) {}
      }
      save();
      updateBell();
      if (!state.settings.reminders) {
        reminderQueue.length = 0;
        if (reminderOpen) hideReminder();
        toast('Reminders off');
      } else {
        toast('Reminders on · priority tasks nudge you 10 min before');
        checkReminders();
      }
    });
    $('#reminder').addEventListener('click', e => {
      if (e.target.closest('[data-rem-close]')) { hideReminder(); return; }
      if (e.target.closest('[data-rem-open]')) {
        const id = $('#reminder').dataset.entry;
        hideReminder();
        openEditor({ id });
      }
    });

    $('#entryForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = $('#fTitle').value.trim() || 'Untitled';
      let start = $('#fStart').value || '09:00';
      let end = $('#fEnd').value || '10:00';
      if (!isTime(start)) start = '09:00';
      if (!isTime(end) || toMin(end) <= toMin(start)) end = toTime(Math.min(toMin(start) + 60, 24 * 60 - 1));
      const payload = {
        day: clamp(Number($('#fDay').value) || 0, 0, 6),
        start, end,
        title: title.slice(0, 120),
        cat: ui.formCat,
        note: $('#fNote').value.trim().slice(0, 600),
        important: !!ui.formImportant
      };
      if (ui.editingId) {
        const entry = state.entries.find(x => x.id === ui.editingId);
        if (entry) Object.assign(entry, payload);
        closeModal();
        save();
        renderAll();
        checkReminders();
        toast('Entry updated');
      } else {
        state.entries.push({ id: uid(), ...payload });
        closeModal();
        save();
        renderAll();
        checkReminders();
        toast(payload.important ? '★ Priority added to ' + DAYS[payload.day] : 'Added to ' + DAYS[payload.day]);
      }
    });

    $('#filterBar').addEventListener('click', e => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      const id = b.dataset.filter;
      if (id === 'all') ui.filter.clear();
      else if (ui.filter.has(id)) ui.filter.delete(id);
      else ui.filter.add(id);
      renderFilters();
      renderBoard();
    });

    const board = $('#boardHost');

    board.addEventListener('click', e => {
      if (performance.now() < suppressClick) return;
      const star = e.target.closest('[data-star]');
      if (star) { e.stopPropagation(); toggleImportant(star.dataset.star); return; }
      const check = e.target.closest('[data-check]');
      if (check) { e.stopPropagation(); toggleDone(check.dataset.check, check.dataset.date); return; }
      const ev = e.target.closest('.event, .dv-card');
      if (ev) { openEditor({ id: ev.dataset.id || ev.dataset.edit }); return; }
      const add = e.target.closest('[data-day-add]');
      if (add) { openEditor({ day: dayIdx(ui.cursor), start: defaultStart() }); return; }
      const head = e.target.closest('[data-open-day]');
      if (head) { ui.cursor = parseKey(head.dataset.openDay); ui.view = 'day'; ui.scrollKey = null; renderAll(); return; }
      const col = e.target.closest('.col');
      if (col) {
        const r = col.getBoundingClientRect();
        const { s, e: en } = timeBounds();
        let m = s * 60 + (e.clientY - r.top) / HOUR_H * 60;
        m = Math.floor(m / 15) * 15;
        m = clamp(m, s * 60, en * 60 - 15);
        openEditor({ day: Number(col.dataset.day), start: toTime(m), end: toTime(Math.min(m + 60, en * 60)) });
      }
    });

    board.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0) return;
      const el = e.target.closest('.event');
      if (!el || e.target.closest('[data-check]')) return;
      startDrag(e, el);
    });
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', () => {
      if (!drag) return;
      const d = drag; drag = null;
      document.body.classList.remove('is-dragging');
      if (d.col) d.col.classList.remove('drop-target');
      if (d.ghost) d.ghost.remove();
      d.el.classList.remove('dragging');
    });

    board.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target.closest('.event, .dv-card');
      if (!el) return;
      e.preventDefault();
      openEditor({ id: el.dataset.id || el.dataset.edit });
    });

    $('#agendaList').addEventListener('click', e => {
      const check = e.target.closest('[data-check]');
      if (check) { e.stopPropagation(); toggleDone(check.dataset.check, check.dataset.date); return; }
      const item = e.target.closest('[data-edit]');
      if (item) openEditor({ id: item.dataset.edit });
    });
    $('#agendaList').addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const item = e.target.closest('[data-edit]');
      if (!item) return;
      e.preventDefault();
      openEditor({ id: item.dataset.edit });
    });
    $('#priorityList').addEventListener('click', e => {
      const check = e.target.closest('[data-check]');
      if (check) { e.stopPropagation(); toggleDone(check.dataset.check, check.dataset.date); return; }
      const item = e.target.closest('[data-edit]');
      if (item) openEditor({ id: item.dataset.edit });
    });
    $('#priorityList').addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const item = e.target.closest('[data-edit]');
      if (!item) return;
      e.preventDefault();
      openEditor({ id: item.dataset.edit });
    });

    document.addEventListener('input', e => {
      const ta = e.target.closest('[data-note-date]');
      if (ta) onNoteInput(ta);
    });

    document.addEventListener('keydown', e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      if (e.key === 'Escape') {
        if ($('#modal').classList.contains('open')) closeModal();
        return;
      }
      if (typing || $('#modal').classList.contains('open')) return;
      const k = e.key.toLowerCase();
      if (k === 'n') { e.preventDefault(); openEditor({ day: defaultDay(), start: defaultStart() }); }
      else if (k === 't') { e.preventDefault(); ui.cursor = startOfDay(new Date()); renderAll(); }
      else if (k === 'w') { e.preventDefault(); ui.view = 'week'; ui.scrollKey = null; renderAll(); }
      else if (k === 'd') { e.preventDefault(); ui.view = 'day'; ui.scrollKey = null; renderAll(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); ui.cursor = addDays(ui.cursor, ui.view === 'week' ? -7 : -1); renderAll(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); ui.cursor = addDays(ui.cursor, ui.view === 'week' ? 7 : 1); renderAll(); }
    });
  }

  /* ── Boot ──────────────────────────────────────────────── */
  function init() {
    $('#fDay').innerHTML = DAYS.map((d, i) => '<option value="' + i + '">' + d + '</option>').join('');
    bind();
    renderAll();
    if (!hadStored) save();
    setTimeout(checkReminders, 800);
    setInterval(tick, 30000);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }
  init();
})();
</script>
</body>
</html>
